<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcador — Ligas y Copas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch:#0B3D2E;
    --pitch-deep:#071F18;
    --navy:#101728;
    --chalk:#F5F3EA;
    --sage:#8FA695;
    --amber:#F2A93B;
    --amber-dim:#F2A93B22;
    --line:#ffffff14;
    --line-strong:#ffffff26;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, var(--pitch) 0%, transparent 60%),
      var(--pitch-deep);
    color:var(--chalk);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  header.top{padding:30px 20px 16px; text-align:center;}
  header.top h1{
    font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:2px;
    font-size:clamp(28px,6vw,42px); text-transform:uppercase;
  }
  header.top h1 span{color:var(--amber);}
  header.top p{
    font-family:'Space Mono',monospace; color:var(--sage); font-size:11px;
    margin-top:6px; letter-spacing:1.5px; text-transform:uppercase;
  }

  .ticker-wrap{
    background:var(--navy); border-top:1px solid var(--line-strong);
    border-bottom:1px solid var(--amber); overflow:hidden; white-space:nowrap; padding:9px 0;
  }
  .ticker{display:inline-block; font-family:'Space Mono',monospace; font-size:12px; animation:scroll 50s linear infinite;}
  .ticker span{margin-right:36px; color:var(--sage);}
  .ticker span b{color:var(--amber); font-weight:normal;}
  @keyframes scroll{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
  @media (prefers-reduced-motion: reduce){.ticker{animation:none;}}

  nav.tracks{
    display:flex; justify-content:center; gap:6px; padding:20px 14px 8px; flex-wrap:wrap;
    position:sticky; top:0; background:var(--pitch-deep); z-index:10;
  }
  nav.tracks button{
    font-family:'Oswald',sans-serif; font-size:12.5px; letter-spacing:1px; text-transform:uppercase;
    background:transparent; border:1px solid var(--line-strong); color:var(--sage);
    padding:9px 16px; border-radius:3px; cursor:pointer; transition:all .18s ease;
  }
  nav.tracks button:hover{color:var(--chalk); border-color:var(--amber);}
  nav.tracks button.active{background:var(--amber); color:var(--pitch-deep); border-color:var(--amber); font-weight:600;}
  nav.tracks button:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}

  main{max-width:900px; margin:0 auto; padding:14px 16px 20px;}

  .comp-grid{display:flex; flex-direction:column; gap:10px;}
  details.comp-card{
    background:linear-gradient(180deg, #ffffff07, #ffffff02);
    border:1px solid var(--line-strong); border-radius:8px; overflow:hidden;
  }
  details.comp-card[open]{border-color:var(--amber-dim);}
  details.comp-card summary{
    list-style:none; cursor:pointer; padding:15px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  details.comp-card summary::-webkit-details-marker{display:none;}
  .summary-left{display:flex; align-items:center; gap:10px; min-width:0;}
  .summary-left .dot{width:7px;height:7px;border-radius:50%;background:var(--amber); flex-shrink:0;}
  .summary-left h2{
    font-family:'Oswald',sans-serif; font-size:15.5px; text-transform:uppercase; letter-spacing:0.4px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .chevron{font-size:11px; color:var(--sage); flex-shrink:0; transition:transform .2s ease;}
  details.comp-card[open] .chevron{transform:rotate(180deg);}

  .card-body{padding:0 16px 16px;}

  .mini-tabs{display:flex; gap:6px; margin-bottom:12px;}
  .mini-tabs button{
    font-family:'Space Mono',monospace; font-size:10.5px; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; border:1px solid var(--line); color:var(--sage);
    padding:5px 12px; border-radius:20px; cursor:pointer;
  }
  .mini-tabs button.active{background:var(--amber-dim); border-color:var(--amber); color:var(--amber);}

  .match{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0; border-top:1px solid var(--line); font-size:13px;
  }
  .match:first-of-type{border-top:none;}
  .match .teams{color:var(--chalk);}
  .match .when{
    font-family:'Space Mono',monospace; color:var(--amber); font-size:11.5px;
    white-space:nowrap; margin-left:10px;
  }

  .empty-note, .status-line{color:var(--sage); font-size:12.5px;}
  .status-line.loading{font-family:'Space Mono',monospace; font-size:11px;}

  table.standings{width:100%; border-collapse:collapse; font-size:12px;}
  table.standings th{
    text-align:left; font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.5px;
    text-transform:uppercase; color:var(--sage); padding:5px 4px; border-bottom:1px solid var(--line-strong);
  }
  table.standings td{padding:6px 4px; border-bottom:1px solid var(--line); white-space:nowrap;}
  table.standings td.team{white-space:normal; color:var(--chalk);}
  table.standings td.num, table.standings th.num{text-align:center;}
  table.standings td.pts{color:var(--amber); font-weight:600; text-align:center;}
  table.standings tr:last-child td{border-bottom:none;}

  .all-matches{display:flex; flex-direction:column; gap:8px;}
  .all-match{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:linear-gradient(180deg, #ffffff07, #ffffff02);
    border:1px solid var(--line-strong); border-radius:6px; padding:12px 14px;
  }
  .all-match .info{min-width:0;}
  .all-match .comp-tag{
    font-family:'Space Mono',monospace; font-size:9.5px; letter-spacing:0.5px; text-transform:uppercase;
    color:var(--amber); display:block; margin-bottom:3px;
  }
  .all-match .teams{font-size:13.5px; color:var(--chalk); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .all-match .when{font-family:'Space Mono',monospace; font-size:12px; color:var(--sage); text-align:right; white-space:nowrap; flex-shrink:0;}
  .all-match .when b{display:block; color:var(--amber); font-size:13px;}

  footer{text-align:center; color:var(--sage); font-family:'Space Mono',monospace; font-size:11px; margin-top:30px; padding:0 20px;}
</style>
</head>
<body>

<header class="top">
  <h1>Marcador<span>.</span></h1>
  <p>Ligas activas · México · Europa · Copas &amp; Federaciones</p>
</header>

<div class="ticker-wrap">
  <div class="ticker" id="ticker">Cargando próximos partidos…</div>
</div>

<nav class="tracks" id="tracks">
  <button data-track="mexico" class="active">México</button>
  <button data-track="europa">Europa</button>
  <button data-track="copas">Copas &amp; Federaciones</button>
  <button data-track="todos">Todos los partidos</button>
</nav>

<main>
  <div class="comp-grid" id="grid"></div>
</main>

<footer>Datos vía TheSportsDB · llave pública compartida (puede saturarse a ratos)</footer>

<script>
const API = 'https://www.thesportsdb.com/api/v1/json/123';

// IDs verificados directamente de TheSportsDB. "season" se usa para la tabla
// de posiciones (lookuptable.php) — copas de eliminación directa o fuera de
// ciclo (Copa América, Mundial de Clubes, Concacaf) pueden no tener tabla.
const TRACKS = {
  mexico: [
    { name: 'Liga MX', id: '4350', season: '2025-2026' }
  ],
  europa: [
    { name: 'Premier League (Inglaterra)', id: '4328', season: '2025-2026' },
    { name: 'La Liga (España)', id: '4335', season: '2025-2026' },
    { name: 'Serie A (Italia)', id: '4332', season: '2025-2026' },
    { name: 'Bundesliga (Alemania)', id: '4331', season: '2025-2026' },
    { name: 'Ligue 1 (Francia)', id: '4334', season: '2025-2026' }
  ],
  copas: [
    { name: 'UEFA Champions League', id: '4480', season: '2025-2026' },
    { name: 'UEFA Europa League', id: '4481', season: '2025-2026' },
    { name: 'Concacaf Champions Cup', id: '4721', season: '2026' },
    { name: 'Copa Libertadores', id: '4501', season: '2026' },
    { name: 'Copa Sudamericana', id: '4724', season: '2026' },
    { name: 'Copa América', id: '4499', season: '2024' },
    { name: 'Mundial de Clubes FIFA', id: '4503', season: '2025' }
  ]
};
const ALL_COMPS = [...TRACKS.mexico, ...TRACKS.europa, ...TRACKS.copas];

const grid = document.getElementById('grid');
const tickerEl = document.getElementById('ticker');
let tickerItems = [];

function fmtDate(dateStr, timeStr){
  if(!dateStr) return '';
  try{
    const d = new Date(`${dateStr}T${timeStr || '00:00:00'}`);
    return d.toLocaleDateString('es-MX', {day:'2-digit', month:'short'}) +
      (timeStr ? ' · ' + d.toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'}) : '');
  }catch(e){ return dateStr; }
}

async function fetchJSON(url){
  const res = await fetch(url);
  if (!res.ok){
    const err = new Error('HTTP ' + res.status);
    err.status = res.status;
    throw err;
  }
  return res.json();
}

function errMessage(e){
  if (e && e.status === 429) return 'Límite de la API alcanzado (llave compartida). Intenta en un minuto.';
  if (e && e.status) return `Error al consultar TheSportsDB (código ${e.status}).`;
  return 'No se pudo conectar con TheSportsDB.';
}

// ---------- Tarjeta de competición (acordeón) ----------
function buildCompCard(comp){
  const details = document.createElement('details');
  details.className = 'comp-card';
  details.innerHTML = `
    <summary>
      <div class="summary-left"><span class="dot"></span><h2>${comp.name}</h2></div>
      <span class="chevron">▾</span>
    </summary>
    <div class="card-body">
      <div class="mini-tabs">
        <button data-view="matches" class="active">Partidos</button>
        <button data-view="table">Tabla</button>
      </div>
      <div class="view-matches"><div class="status-line loading">Cargando…</div></div>
      <div class="view-table" style="display:none;"><div class="status-line loading">Cargando…</div></div>
    </div>
  `;
  grid.appendChild(details);

  const viewMatches = details.querySelector('.view-matches');
  const viewTable = details.querySelector('.view-table');
  const miniTabs = details.querySelectorAll('.mini-tabs button');

  let matchesLoaded = false;
  let tableLoaded = false;

  async function loadMatches(){
    if (matchesLoaded) return;
    matchesLoaded = true;
    try{
      const data = await fetchJSON(`${API}/eventsnextleague.php?id=${comp.id}`);
      const events = (data && data.events) ? data.events.slice(0,6) : [];
      if (!events.length){
        viewMatches.innerHTML = `<div class="empty-note">Sin partidos próximos programados (puede estar en receso).</div>`;
        return;
      }
      viewMatches.innerHTML = '';
      events.forEach(ev => {
        const row = document.createElement('div');
        row.className = 'match';
        row.innerHTML = `
          <span class="teams">${ev.strHomeTeam} vs ${ev.strAwayTeam}</span>
          <span class="when">${fmtDate(ev.dateEvent, ev.strTime)}</span>
        `;
        viewMatches.appendChild(row);
      });
    }catch(e){
      viewMatches.innerHTML = `<div class="empty-note">${errMessage(e)}</div>`;
    }
  }

  async function loadTable(){
    if (tableLoaded) return;
    tableLoaded = true;
    try{
      const data = await fetchJSON(`${API}/lookuptable.php?l=${comp.id}&s=${comp.season}`);
      const rows = (data && data.table) ? data.table : [];
      if (!rows.length){
        viewTable.innerHTML = `<div class="empty-note">Tabla no disponible para esta competición (torneo de eliminación directa o fuera de temporada).</div>`;
        return;
      }
      let html = `<table class="standings"><thead><tr>
        <th class="num">#</th><th>Equipo</th><th class="num">PJ</th><th class="num">DG</th><th class="num">Pts</th>
      </tr></thead><tbody>`;
      rows.forEach(r => {
        html += `<tr>
          <td class="num">${r.intRank}</td>
          <td class="team">${r.strTeam}</td>
          <td class="num">${r.intPlayed}</td>
          <td class="num">${r.intGoalDifference}</td>
          <td class="pts">${r.intPoints}</td>
        </tr>`;
      });
      html += '</tbody></table>';
      viewTable.innerHTML = html;
    }catch(e){
      viewTable.innerHTML = `<div class="empty-note">${errMessage(e)}</div>`;
    }
  }

  details.addEventListener('toggle', () => { if (details.open) loadMatches(); });

  miniTabs.forEach(btn => {
    btn.addEventListener('click', () => {
      miniTabs.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (btn.dataset.view === 'matches'){
        viewMatches.style.display = ''; viewTable.style.display = 'none';
        loadMatches();
      } else {
        viewMatches.style.display = 'none'; viewTable.style.display = '';
        loadTable();
      }
    });
  });

  return { details, loadMatches, comp };
}

// ---------- Tab "Todos los partidos" ----------
async function buildAllMatchesView(){
  grid.innerHTML = `<div class="status-line loading">Cargando todos los partidos…</div>`;
  tickerItems = [];

  const results = [];
  for (const comp of ALL_COMPS){
    try{
      const data = await fetchJSON(`${API}/eventsnextleague.php?id=${comp.id}`);
      const events = (data && data.events) ? data.events.slice(0,5) : [];
      events.forEach(ev => results.push({ comp, ev }));
    }catch(e){ /* se omite silenciosamente esta competición en la vista combinada */ }
    await new Promise(r => setTimeout(r, 300));
  }

  results.sort((a,b) => {
    const da = new Date(`${a.ev.dateEvent}T${a.ev.strTime || '00:00:00'}`);
    const db = new Date(`${b.ev.dateEvent}T${b.ev.strTime || '00:00:00'}`);
    return da - db;
  });

  if (!results.length){
    grid.innerHTML = `<div class="empty-note">No se encontraron partidos próximos en ninguna competición ahora mismo.</div>`;
    tickerEl.textContent = 'No hay partidos próximos disponibles por ahora.';
    return;
  }

  const wrap = document.createElement('div');
  wrap.className = 'all-matches';
  results.forEach(({comp, ev}) => {
    const row = document.createElement('div');
    row.className = 'all-match';
    const [datePart, timePart] = fmtDate(ev.dateEvent, ev.strTime).split(' · ');
    row.innerHTML = `
      <div class="info">
        <span class="comp-tag">${comp.name}</span>
        <span class="teams">${ev.strHomeTeam} vs ${ev.strAwayTeam}</span>
      </div>
      <div class="when"><b>${datePart || ''}</b>${timePart || ''}</div>
    `;
    wrap.appendChild(row);
    tickerItems.push(`${comp.name}: <b>${ev.strHomeTeam} vs ${ev.strAwayTeam}</b> (${fmtDate(ev.dateEvent, ev.strTime)})`);
  });
  grid.innerHTML = '';
  grid.appendChild(wrap);
  renderTicker();
}

function renderTicker(){
  if (!tickerItems.length) return;
  const html = tickerItems.map(t => `<span>${t}</span>`).join('');
  tickerEl.innerHTML = html + html;
}

async function loadTrack(trackKey){
  if (trackKey === 'todos'){ await buildAllMatchesView(); return; }
  grid.innerHTML = '';
  tickerItems = [];
  tickerEl.textContent = 'Cargando próximos partidos…';

  const cards = TRACKS[trackKey].map(buildCompCard);
  if (cards[0]){
    cards[0].details.open = true;
    await cards[0].loadMatches();
  }
}

document.getElementById('tracks').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-track]');
  if (!btn) return;
  document.querySelectorAll('nav.tracks button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadTrack(btn.dataset.track);
});

loadTrack('mexico');
</script>

</body>
</html>
