<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcador — Ligas y Copas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch:#0B3D2E;
    --pitch-deep:#082A20;
    --navy:#131B2E;
    --chalk:#F5F3EA;
    --sage:#8FA695;
    --amber:#F2A93B;
    --amber-dim:#F2A93B33;
    --line:#ffffff1a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--pitch-deep);
    background-image:
      repeating-linear-gradient(90deg, transparent 0 79px, var(--line) 79px 80px),
      radial-gradient(ellipse at top, var(--pitch) 0%, var(--pitch-deep) 70%);
    color:var(--chalk);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  header.top{
    padding:28px 20px 18px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  header.top h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    letter-spacing:2px;
    font-size:clamp(28px,6vw,44px);
    text-transform:uppercase;
  }
  header.top h1 span{color:var(--amber);}
  header.top p{
    font-family:'Space Mono',monospace;
    color:var(--sage);
    font-size:12px;
    margin-top:6px;
    letter-spacing:1px;
    text-transform:uppercase;
  }

  /* Scoreboard ticker */
  .ticker-wrap{
    background:var(--navy);
    border-bottom:2px solid var(--amber);
    overflow:hidden;
    white-space:nowrap;
    padding:10px 0;
  }
  .ticker{
    display:inline-block;
    font-family:'Space Mono',monospace;
    font-size:13px;
    animation:scroll 45s linear infinite;
  }
  .ticker span{margin-right:40px; color:var(--chalk);}
  .ticker span b{color:var(--amber);}
  @keyframes scroll{
    0%{transform:translateX(0);}
    100%{transform:translateX(-50%);}
  }
  @media (prefers-reduced-motion: reduce){
    .ticker{animation:none;}
  }

  nav.tracks{
    display:flex;
    justify-content:center;
    gap:8px;
    padding:22px 16px 6px;
    flex-wrap:wrap;
  }
  nav.tracks button{
    font-family:'Oswald',sans-serif;
    font-size:14px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    background:transparent;
    border:1px solid var(--line);
    color:var(--sage);
    padding:10px 20px;
    border-radius:2px;
    cursor:pointer;
    transition:all .2s ease;
  }
  nav.tracks button:hover{color:var(--chalk); border-color:var(--amber);}
  nav.tracks button.active{
    background:var(--amber);
    color:var(--pitch-deep);
    border-color:var(--amber);
    font-weight:600;
  }
  nav.tracks button:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}

  main{max-width:1000px; margin:0 auto; padding:20px;}

  .comp-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:16px;
  }
  .comp-card{
    background:linear-gradient(180deg, #ffffff08, #ffffff02);
    border:1px solid var(--line);
    border-radius:6px;
    padding:18px 18px 16px;
  }
  .comp-card h2{
    font-family:'Oswald',sans-serif;
    font-size:17px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--chalk);
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
  }
  .comp-card h2 .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--amber);
    flex-shrink:0;
  }
  .status-line{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--sage);
    margin-bottom:10px;
  }
  .match{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 0;
    border-top:1px solid var(--line);
    font-size:13px;
  }
  .match:first-of-type{border-top:none;}
  .match .teams{color:var(--chalk);}
  .match .when{
    font-family:'Space Mono',monospace;
    color:var(--amber);
    font-size:12px;
    white-space:nowrap;
    margin-left:10px;
  }
  .empty-note{
    color:var(--sage);
    font-size:12.5px;
    font-style:italic;
    padding:6px 0;
  }
  .loading{
    color:var(--sage);
    font-family:'Space Mono',monospace;
    font-size:12px;
  }

  footer{
    text-align:center;
    color:var(--sage);
    font-family:'Space Mono',monospace;
    font-size:11px;
    margin-top:40px;
    padding:0 20px;
  }
</style>
</head>
<body>

<header class="top">
  <h1>Marcador<span>.</span></h1>
  <p>Ligas activas · México · Europa · Copas &amp; Federaciones</p>
</header>

<div class="ticker-wrap">
  <div class="ticker" id="ticker">Cargando próximos partidos…</div>
</div>

<nav class="tracks" id="tracks">
  <button data-track="mexico" class="active">México</button>
  <button data-track="europa">Europa</button>
  <button data-track="copas">Copas &amp; Federaciones</button>
</nav>

<main>
  <div class="comp-grid" id="grid"></div>
</main>

<footer>Datos vía TheSportsDB · actualiza al recargar la página</footer>

<script>
const API = 'https://www.thesportsdb.com/api/v1/json/123';

// Grupos de competiciones a trackear.
// "match" es una lista de fragmentos de texto (en el nombre real de TheSportsDB)
// usados para encontrar la liga correcta dentro del catálogo completo.
const TRACKS = {
  mexico: [
    { name: 'Liga MX', match: ['mexican primera division', 'liga mx', 'mexico primera division'] }
  ],
  europa: [
    { name: 'Premier League (Inglaterra)', match: ['english premier league'] },
    { name: 'La Liga (España)', match: ['spanish la liga', 'la liga', 'laliga'] },
    { name: 'Serie A (Italia)', match: ['italian serie a'] },
    { name: 'Bundesliga (Alemania)', match: ['german bundesliga'] },
    { name: 'Ligue 1 (Francia)', match: ['french ligue 1', 'ligue 1', 'ligue1'] }
  ],
  copas: [
    { name: 'UEFA Champions League', match: ['uefa champions league'] },
    { name: 'UEFA Europa League', match: ['uefa europa league'] },
    { name: 'Concacaf Champions Cup', match: ['concacaf champions'] },
    { name: 'Copa Libertadores', match: ['copa libertadores', 'conmebol libertadores'] },
    { name: 'Copa Sudamericana', match: ['copa sudamericana', 'conmebol sudamericana'] },
    { name: 'Copa América', match: ['copa america'] },
    { name: 'Mundial de Clubes FIFA', match: ['fifa club world cup', 'club world cup'] }
  ]
};

const grid = document.getElementById('grid');
const tickerEl = document.getElementById('ticker');
let tickerItems = [];

// Catálogo completo de ligas, se descarga una sola vez y se reutiliza.
let leagueCatalog = null;
async function getLeagueCatalog(){
  if (leagueCatalog) return leagueCatalog;
  try{
    const res = await fetch(`${API}/all_leagues.php`);
    const data = await res.json();
    leagueCatalog = (data && data.leagues) ? data.leagues : [];
  }catch(e){
    leagueCatalog = [];
  }
  return leagueCatalog;
}

function normalize(str){
  return (str || '')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // quita acentos
    .replace(/[^a-z0-9]/g, ''); // quita espacios y puntuación
}

async function findLeagueId(matchFragments){
  const catalog = await getLeagueCatalog();
  for (const frag of matchFragments){
    const fragNorm = normalize(frag);
    const found = catalog.find(l =>
      l.strSport === 'Soccer' &&
      normalize(l.strLeague).includes(fragNorm)
    );
    if (found) return found.idLeague;
  }
  return null;
}

function fmtDate(dateStr, timeStr){
  if(!dateStr) return '';
  try{
    const d = new Date(`${dateStr}T${timeStr || '00:00:00'}`);
    return d.toLocaleDateString('es-MX', {day:'2-digit', month:'short'}) +
      (timeStr ? ' · ' + d.toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'}) : '');
  }catch(e){ return dateStr; }
}

async function loadCompetition(comp){
  const card = document.createElement('div');
  card.className = 'comp-card';
  card.innerHTML = `
    <h2><span class="dot"></span>${comp.name}</h2>
    <div class="status-line loading">Buscando datos…</div>
  `;
  grid.appendChild(card);

  const id = await findLeagueId(comp.match);
  const statusLine = card.querySelector('.status-line');

  if (!id){
    statusLine.textContent = `No se encontró "${comp.name}" en el catálogo de TheSportsDB.`;
    statusLine.classList.remove('loading');
    return;
  }

  try{
    const res = await fetch(`${API}/eventsnextleague.php?id=${id}`);
    const data = await res.json();
    const events = (data && data.events) ? data.events.slice(0,5) : [];

    statusLine.textContent = events.length ? 'Próximos partidos' : 'Sin partidos próximos programados';
    statusLine.classList.remove('loading');

    if (!events.length){
      const p = document.createElement('div');
      p.className = 'empty-note';
      p.textContent = 'Puede que la temporada esté en receso o aún no se publique el calendario.';
      card.appendChild(p);
    } else {
      events.forEach(ev => {
        const row = document.createElement('div');
        row.className = 'match';
        row.innerHTML = `
          <span class="teams">${ev.strHomeTeam} vs ${ev.strAwayTeam}</span>
          <span class="when">${fmtDate(ev.dateEvent, ev.strTime)}</span>
        `;
        card.appendChild(row);
        tickerItems.push(`${comp.name}: <b>${ev.strHomeTeam} vs ${ev.strAwayTeam}</b> (${fmtDate(ev.dateEvent, ev.strTime)})`);
      });
      renderTicker();
    }
  }catch(e){
    statusLine.textContent = 'No se pudieron cargar los partidos (revisa tu conexión).';
    statusLine.classList.remove('loading');
  }

  return card;
}

function renderTicker(){
  if (!tickerItems.length) return;
  const html = tickerItems.map(t => `<span>${t}</span>`).join('');
  tickerEl.innerHTML = html + html; // duplicado para el loop continuo
}

async function loadTrack(trackKey){
  grid.innerHTML = '';
  tickerItems = [];
  tickerEl.textContent = 'Cargando próximos partidos…';
  const comps = TRACKS[trackKey];
  for (const comp of comps){
    await loadCompetition(comp);
  }
  if (!tickerItems.length){
    tickerEl.textContent = 'No hay partidos próximos disponibles para esta sección por ahora.';
  }
}

document.getElementById('tracks').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-track]');
  if (!btn) return;
  document.querySelectorAll('nav.tracks button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadTrack(btn.dataset.track);
});

loadTrack('mexico');
</script>

</body>
</html>
